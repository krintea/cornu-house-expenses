      if (action === 'driveTest') {
        const probe = {test: crypto.randomUUID()};
        const id = await write('cornu-sync-test.json', probe);
        try {
          if ((await read(id)).test !== probe.test) throw new Error('Verificarea a eșuat.');
        } finally {
          await request('drive/v3/files/' + encodeURIComponent(id), {method: 'DELETE'});
        }
        status.textContent = 'Test reușit. Fișierul fictiv a fost scris, citit și șters.';
      } else if (action === 'driveSave') {
        const serialized = JSON.stringify(state);
        const id = await write(name, JSON.parse(serialized));
        if (JSON.stringify(await read(id)) !== serialized) throw new Error('Copia nu a putut fi verificată.');
        status.textContent = 'Copie salvată și verificată în Drive.';
      } else {
        const query = new URLSearchParams({spaces: 'appDataFolder', q: "trashed = false and name = '" + name + "'",
          fields: 'files(id,createdTime)', orderBy: 'createdTime desc', pageSize: '1'});
        const {files} = await (await request('drive/v3/files?' + query)).json();
        if (!files.length) throw new Error('Nu există o copie în acest cont.');
        const restored = await read(files[0].id);
        if (!isValidState(restored)) throw new Error('Copie incompatibilă.');
        if (!confirm('Înlocuiești datele locale cu copia din ' + new Date(files[0].createdTime).toLocaleString('ro-RO') + '?')) {
          status.textContent = 'Restaurare anulată.';
          return;
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(restored));
        state = restored;
        renderAll();
        status.textContent = 'Ultima copie din Drive a fost încărcată.';
      }
    } catch (error) {
      status.textContent = error.message;
    } finally {
      buttons.forEach(button => button.disabled = false);
    }
  }
  buttons.forEach(button => button.addEventListener('click', () => run(button.id)));
})();
</script>
</body>
</html>
