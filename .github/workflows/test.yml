name: Tests
on:
  pull_request:
  push:
    branches: [main, feat/gemini-document-analysis]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r backend/requirements.txt pytest==9.2.0
      - run: python -m pytest -q tests/test_backend.py
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: bash -n scripts/deploy.sh && bash scripts/deploy.sh
